[env:m5stack-core]
platform = espressif32
board = m5stack-core2
board_build.mcu = esp32s3
framework = arduino

; M5Stick C Plus2 ライブラリ
lib_deps =
    M5StickCPlus2
    ArduinoJson @ ^6.20.0

; コンパイル設定
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=c++17
    -O2

; シリアルモニター
monitor_speed = 115200
monitor_port = /dev/ttyUSB0

; ビルド出力フォルダ
build_dir = .pio/build/m5stack-core2

; テスト設定
test_framework = unity
test_ignore = tests/unsupported

; アップロード設定
upload_protocol = esptool
upload_speed = 921600
upload_resetmethod = rts
